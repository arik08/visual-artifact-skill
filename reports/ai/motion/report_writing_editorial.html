<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>편집자의 책상 — AI로 회사 보고서 잘 쓰는 법</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  :root {
    --paper: #F3EEE3; --paper2: #FBF8F1; --ink: #1D1B18; --ink2: #4A463F; --faint: #8E877A; --rule: #D8CFBE;
    --red: #D3262E; --blue: #2753C7; --hl: #FFE14D; --sticky: #FFE680; --green: #2E7D4F;
    --serif: "Noto Serif KR", "Batang", serif; --sans: "Pretendard Variable", Pretendard, sans-serif;
    --pen: "Nanum Pen Script", cursive; --type: "Nanum Gothic Coding", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #2A2723; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--sans); color: var(--ink); word-break: keep-all; }
  #stage { position: relative; width: 1920px; height: 1080px; background: var(--paper); overflow: hidden; flex: none; }
  #grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; pointer-events: none; z-index: 40; }
  /* 러닝 헤더·폴리오 (잡지 지면처럼) */
  .run { position: absolute; z-index: 20; font-family: var(--serif); color: var(--ink2); font-size: 20px; letter-spacing: .02em; }
  #run-l { left: 96px; top: 52px; } #run-r { right: 96px; top: 52px; text-align: right; }
  #run-r b { color: var(--red); font-weight: 600; }
  #rule-top { position: absolute; left: 96px; right: 96px; top: 92px; height: 1px; background: var(--ink); opacity: .7; z-index: 20; }
  #rule-bot { position: absolute; left: 96px; right: 96px; bottom: 76px; height: 1px; background: var(--rule); z-index: 20; }
  #pencil { position: absolute; left: 96px; bottom: 75px; height: 3px; width: 0; background: var(--ink); z-index: 21; }
  #folio { position: absolute; right: 96px; bottom: 38px; font-family: var(--serif); font-size: 20px; color: var(--ink2); z-index: 20; }
  #byline { position: absolute; left: 96px; bottom: 38px; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--faint); z-index: 20; }
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .serif { font-family: var(--serif); } .pen { font-family: var(--pen); } .type { font-family: var(--type); }
  .red { color: var(--red); } .blue { color: var(--blue); } .faint { color: var(--faint); }
  .H1 { font-family: var(--serif); font-weight: 900; font-size: 112px; line-height: 1.12; letter-spacing: -0.03em; }
  .H2 { font-family: var(--serif); font-weight: 900; font-size: 72px; line-height: 1.18; letter-spacing: -0.025em; }
  .H3 { font-family: var(--serif); font-weight: 600; font-size: 44px; line-height: 1.3; }
  .p { font-size: 30px; line-height: 1.6; color: var(--ink2); }
  .numeral { position: absolute; left: 96px; top: 120px; font-family: var(--serif); font-weight: 900; font-size: 300px; line-height: 1; color: transparent; -webkit-text-stroke: 3px var(--red); }
  .ptitle { position: absolute; left: 330px; top: 170px; }
  .ptitle .k { font-family: var(--serif); font-size: 24px; letter-spacing: .3em; color: var(--red); }
  .ptitle .t { font-family: var(--serif); font-weight: 900; font-size: 76px; letter-spacing: -0.03em; line-height: 1.12; margin-top: 6px; }
  .sheet { position: absolute; background: var(--paper2); box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 18px 40px rgba(60,45,20,.16), 0 3px 8px rgba(60,45,20,.08); border-radius: 3px; }
  .typed { font-family: var(--type); font-size: 25px; line-height: 1.75; color: #2C2A26; white-space: pre-wrap; }
  .sticky { position: absolute; width: 330px; min-height: 250px; padding: 34px 30px; background: var(--sticky); box-shadow: 0 14px 26px rgba(80,60,0,.18); font-family: var(--pen); font-size: 50px; line-height: 1.1; color: #2A2620; }
  .sticky::before { content: ""; position: absolute; left: 50%; top: -14px; width: 110px; height: 30px; margin-left: -55px; background: rgba(255,255,255,.55); transform: rotate(-3deg); }
  .hl { background: linear-gradient(transparent 55%, var(--hl) 55%); background-size: 0% 100%; background-repeat: no-repeat; }
  .stamp { position: absolute; border: 6px solid var(--red); color: var(--red); font-family: var(--serif); font-weight: 900; padding: 6px 22px; border-radius: 8px; letter-spacing: .1em; mix-blend-mode: multiply; }
  .char { display: inline-block; white-space: pre; } .word { display: inline-block; white-space: nowrap; }
  #play { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; background: rgba(243,238,227,.86); cursor: pointer; }
  #play .seal { width: 170px; height: 170px; border-radius: 50%; border: 6px solid var(--red); color: var(--red); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 900; font-size: 46px; transform: rotate(-8deg); }
  #play .t { font-family: var(--serif); font-size: 26px; color: var(--ink2); }
  #play small { font-family: var(--serif); font-size: 18px; color: var(--faint); }
  body.render #play, body.render #player { display: none; }
  /* ── 동영상 플레이어 (종이 톤) ── */
  #player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; padding: 10px 28px 12px; background: #E6DECD; border-top: 1px solid #C9BFAB; font-family: var(--serif); color: #1D1B18; user-select: none; transition: opacity .25s, transform .25s; }
  #bar { display: flex; align-items: center; gap: 16px; height: 40px; }
  #bar button { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; background: #1D1B18; color: #F3EEE3; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #bar button svg { width: 18px; height: 18px; fill: currentColor; }
  #bar #fs { background: transparent; color: #1D1B18; border: 1px solid #8E877A; width: 36px; height: 36px; }
  .time { flex: none; font-size: 15px; font-variant-numeric: tabular-nums; color: #4A463F; min-width: 44px; text-align: center; }
  #seek { position: relative; flex: 1; height: 28px; cursor: pointer; }
  #seek .track { position: absolute; left: 0; right: 0; top: 12px; height: 4px; background: #CFC5B2; border-radius: 2px; }
  #seek .fill { position: absolute; left: 0; top: 12px; height: 4px; width: 0; background: #D3262E; border-radius: 2px; }
  #seek .knob { position: absolute; top: 6px; width: 16px; height: 16px; margin-left: -8px; left: 0; border-radius: 50%; background: #D3262E; box-shadow: 0 0 0 3px #F3EEE3; }
  #seek .tk { position: absolute; top: 9px; width: 2px; height: 10px; background: #8E877A; }
  #seek .tip { position: absolute; bottom: 30px; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: #1D1B18; color: #F3EEE3; font-size: 14px; white-space: nowrap; opacity: 0; pointer-events: none; }
  #seek:hover .tip { opacity: 1; }
  #seek:hover .track, #seek:hover .fill { height: 6px; top: 11px; }
  #chapters { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  #chapters button { flex: 1 1 0; min-width: 0; padding: 5px 6px 6px; border: 1px solid #C9BFAB; border-radius: 6px; background: #F3EEE3; font-family: var(--serif); font-size: 14px; line-height: 1.25; color: #4A463F; cursor: pointer; text-align: center; word-break: keep-all; }
  #chapters button b { display: block; color: #D3262E; font-weight: 900; font-size: 12px; font-variant-numeric: tabular-nums; }
  #chapters button:hover { background: #FBF8F1; border-color: #8E877A; }
  #chapters button.on { background: #1D1B18; color: #F3EEE3; border-color: #1D1B18; }
  #chapters button.on b { color: #FF8A8F; }
  /* 전체화면: 바로가기 숨김, 재생 막대는 마우스를 아래로 내리면 영상 위에 */
  body.fs #chapters { display: none; }
  body.fs #player { background: linear-gradient(transparent, rgba(29,27,24,.78) 45%); border-top: 0; padding: 40px 36px 18px; color: #F3EEE3; opacity: 0; transform: translateY(16px); pointer-events: none; }
  body.fs.ctl #player { opacity: 1; transform: none; pointer-events: auto; }
  body.fs .time { color: #E6DECD; }
  body.fs #bar button { background: #F3EEE3; color: #1D1B18; }
  body.fs #bar #fs { background: transparent; color: #F3EEE3; border-color: rgba(243,238,227,.6); }
  body.fs #seek .track { background: rgba(243,238,227,.35); }
  body.fs.idle { cursor: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="run" id="run-l">편집자 노트 — <i>AI 시대의 보고서 작성</i></div>
  <div class="run" id="run-r"><b id="sec">서문</b></div>
  <div id="rule-top"></div><div id="rule-bot"></div><div id="pencil"></div>
  <div id="byline">Written &amp; scored with Claude Opus 5.5</div>
  <div id="folio">— <span id="pg">1</span> —</div>
  <div id="scenes"></div>
  <svg id="grain" width="1920" height="1080"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .22 0"/></filter><rect width="1920" height="1080" filter="url(#nz)"/></svg>
  <div id="play"><div class="seal">재생</div><div class="t">클릭하면 시작 · 3분 · 소리를 켜 주세요</div><small>Space 재생/일시정지 · ←/→ 5초 이동 · 우클릭 전체화면</small></div>
</div>
<div id="player">
  <div id="bar">
    <button id="pp" title="재생/일시정지 (Space)"></button>
    <span class="time" id="tnow">0:00</span>
    <div id="seek"><div class="track"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div>
    <span class="time" id="tdur">3:00</span>
    <button id="fs" title="전체화면 (우클릭)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg></button>
  </div>
  <div id="chapters"></div>
</div>

<script>
(function () {
  var W = 1920, H = 1080, DUR = 180, BPM = 84, BAR = 60 / BPM * 4; // 2.857초, 63마디
  var R = location.search.indexOf('render') >= 0;
  if (R) document.body.classList.add('render');
  var stage = document.getElementById('stage');
  function fit() {
    if (R) return;
    var fs = !!document.fullscreenElement, ph = fs ? 0 : (document.getElementById('player') || { offsetHeight: 0 }).offsetHeight;
    var s = Math.min(innerWidth / W, (innerHeight - ph) / H);
    stage.style.transform = 'translateY(' + (-ph / 2) + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var root = $('#scenes'), NS = 'http://www.w3.org/2000/svg';
  function el(tag, cls, html, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || root).appendChild(e); return e; }
  function svgEl(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
  function pos(e, x, y, w, h) { e.style.position = 'absolute'; if (x != null) e.style.left = x + 'px'; if (y != null) e.style.top = y + 'px'; if (w) e.style.width = w + 'px'; if (h) e.style.height = h + 'px'; return e; }
  function overlay(p) { return svgEl('svg', { width: W, height: H, viewBox: '0 0 1920 1080', style: 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none' }, p); }
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  // 손으로 그린 동그라미·밑줄·화살표
  function scribbleCircle(cx, cy, rx, ry) {
    var d = '', n = 28, turns = 1.15;
    for (var i = 0; i <= n; i++) { var a = -2.2 + i / n * Math.PI * 2 * turns, j = 1 + (rnd() - .5) * .07; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rx * j).toFixed(1) + ' ' + (cy + Math.sin(a) * ry * j).toFixed(1); }
    return d;
  }
  function wobbleLine(x1, y1, x2, y2) { var mx = (x1 + x2) / 2 + (rnd() - .5) * 10, my = (y1 + y2) / 2 + (rnd() - .5) * 8; return 'M' + x1 + ' ' + y1 + ' Q' + mx + ' ' + my + ' ' + x2 + ' ' + y2; }
  function scene(id) { var s = el('div', 'scene'); s.id = id; return s; }
  function split(e) {
    var tmp = document.createElement('div'); tmp.innerHTML = e.innerHTML;
    function walk(n, cls) { var s = ''; n.childNodes.forEach(function (c) {
      if (c.nodeType === 3) c.textContent.split(/(\s+)/).forEach(function (w) { if (!w) return; if (/^\s+$/.test(w)) { s += '<span class="char"> </span>'; return; } s += '<span class="word">' + Array.from(w).map(function (ch) { return '<span class="char' + (cls ? ' ' + cls : '') + '">' + ch + '</span>'; }).join('') + '</span>'; });
      else if (c.nodeName === 'BR') s += '<br>'; else s += walk(c, c.className); }); return s; }
    e.innerHTML = walk(tmp, ''); return e.querySelectorAll('.char');
  }
  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.out' } });
  window.__tl = tl;
  function B(n) { return n * BAR; }
  function show(s, t0, t1) { tl.set(s, { autoAlpha: 1 }, t0); if (t1 != null) tl.to(s, { autoAlpha: 0, duration: 0.25 }, t1 - 0.25); }
  function inkIn(e, at, st) { var cs = split(e); tl.from(cs, { opacity: 0, y: 8, filter: 'blur(4px)', duration: 0.5, stagger: st || 0.03, ease: 'power1.out' }, at); return cs; }
  function typeOut(e, at, cps) { // 타자기: 글자 단위로 나타남
    var txt = e.textContent; e.textContent = ''; var o = { n: 0 };
    tl.to(o, { n: txt.length, duration: txt.length / (cps || 40), ease: 'none', onUpdate: function () { e.textContent = txt.slice(0, Math.round(o.n)); } }, at);
  }
  function draw(path, at, d) { var L = path.getTotalLength ? 3000 : 3000; tl.fromTo(path, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: d || 0.6, ease: 'power1.inOut', immediateRender: true }, at); }
  function penPath(svg, d, color, w) { return svgEl('path', { d: d, fill: 'none', stroke: color || '#D3262E', 'stroke-width': w || 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .9 }, svg); }
  function hlSweep(scope, at, d) { var cs = scope.querySelectorAll('.char.hl'); tl.to(cs, { backgroundSize: '100% 100%', duration: (d || 0.6) / Math.max(1, cs.length) * 1.6, stagger: (d || 0.6) / Math.max(1, cs.length), ease: 'none' }, at); }
  function stampIn(e, at) { tl.fromTo(e, { scale: 2.6, opacity: 0, rotate: e._rot || -8 }, { scale: 1, opacity: 0.92, rotate: e._rot || -8, duration: 0.28, ease: 'power4.in', immediateRender: true }, at); tl.to(stage, { x: 4, duration: 0.05, yoyo: true, repeat: 3, ease: 'none' }, at + 0.28); }
  function counter(e, from, to, at, d, suf) { var o = { v: from }; e.textContent = Math.round(from) + (suf || ''); tl.to(o, { v: to, duration: d, ease: 'power2.out', onUpdate: function () { e.textContent = Math.round(o.v) + (suf || ''); } }, at); }
  function pageTurn(at) { // 장 전환: 종이가 넘어가는 그림자
    var f = el('div', '', '', stage); f.style.cssText = 'position:absolute;top:0;bottom:0;width:260px;left:1920px;z-index:30;background:linear-gradient(90deg,rgba(60,45,20,0),rgba(60,45,20,.18) 40%,rgba(251,248,241,.95) 60%,rgba(243,238,227,1));';
    tl.fromTo(f, { x: 0 }, { x: -2300, duration: 0.75, ease: 'power2.inOut', immediateRender: false }, at - 0.4);
  }
  function principle(sc, num, kick, title, at) {
    var n = el('div', 'numeral', num, sc);
    tl.from(n, { opacity: 0, x: -40, duration: 0.8 }, at + 0.1);
    var t = el('div', 'ptitle', '<div class="k">' + kick + '</div><div class="t">' + title + '</div>', sc);
    tl.from(t.querySelector('.k'), { opacity: 0, letterSpacing: '0.6em', duration: 0.8 }, at + 0.3);
    inkIn(t.querySelector('.t'), at + 0.5, 0.035);
    return t;
  }

  // 공통: 진행 연필선·쪽번호·섹션명
  tl.to('#pencil', { width: 1728, duration: DUR, ease: 'none' }, 0);
  var SEC = [[0, '서문', 1], [4, '명제', 2], [8, '§1 결론부터', 3], [15, '§2 숫자 다이어트', 4], [22, '§3 안 읽히는 것', 5], [28, '§4 사실·판단·권고', 6], [35, '§5 실행으로', 7], [42, '§6 디자인은 키트에', 8], [48, '§7 검증 자동화', 9], [55, '결재', 10]];
  SEC.forEach(function (s, i) { tl.set('#sec', { textContent: s[1] }, B(s[0])); tl.set('#pg', { textContent: 'p.' + s[2] }, B(s[0])); if (i) pageTurn(B(s[0])); });

  /* ── 서문 (0–4마디): AI 초안이 타이핑되고, 빨간 펜이 문제를 짚는다 ── */
  var s0 = scene('s0'); show(s0, 0, B(4));
  var sh0 = pos(el('div', 'sheet', '', s0), 140, 170, 900, 780); sh0.style.transform = 'rotate(-1.6deg)'; sh0.style.padding = '56px 64px';
  tl.from(sh0, { y: 120, opacity: 0, rotate: -6, duration: 1.0, ease: 'power3.out' }, 0.2);
  var ty0 = el('div', 'typed', '[AI 초안] 3분기 실적 현황 보고\n\n1. 공급과잉 현황\n2. 보호무역 현황\n3. 시장 현황\n4. 실적 현황\n\n영업이익은 \'26.1Q 2,130억원 저점 후 2개 분기 연속 개선해 3Q 4,550억원(이익률 4.6%)이나, 1~3Q 누적은 전년 동기 대비 -34.8%임.\n\n※ 산식: 2,130 + 2,740 + 4,550 = 9,420 …', sh0);
  typeOut(ty0, 0.9, 52);
  var o0 = overlay(s0);
  var c1 = penPath(o0, scribbleCircle(330, 395, 230, 150)); draw(c1, 6.4, 0.7);
  var c2 = penPath(o0, scribbleCircle(560, 640, 420, 95)); draw(c2, 7.1, 0.7);
  var c3 = penPath(o0, wobbleLine(230, 815, 760, 800)); draw(c3, 7.8, 0.4);
  var h0a = pos(el('div', 'H2', 'AI는 보고서를<br>몇 분 만에 쓴다.', s0), 1150, 250, 700); inkIn(h0a, 2.2, 0.05);
  var h0b = pos(el('div', 'pen red', '그런데 왜 아무도<br>끝까지 안 읽을까?', s0), 1160, 560, 700); h0b.style.cssText += ';font-size:84px;line-height:1.05;transform:rotate(-3deg)';
  tl.from(h0b, { clipPath: 'inset(0 100% 0 0)', duration: 1.6, ease: 'power1.inOut' }, 8.2);
  var u0 = penPath(o0, 'M1170 790 C 1350 805, 1550 775, 1760 795', '#D3262E', 6); draw(u0, 9.8, 0.5);

  /* ── 명제 (4–8마디) ── */
  var s1 = scene('s1'); show(s1, B(4), B(8));
  var h1 = pos(el('div', 'H1', '쓰기는 싸졌다.<br><span class="hl" id="hlj">판단</span>은 그렇지 않다.', s1), 140, 250, 1640);
  inkIn(h1, B(4) + 0.3, 0.06); hlSweep(h1, B(4) + 3.4, 0.7);
