<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: var(--sans); color: var(--ink); }

  #bg-grid { position: absolute; inset: 0;

    background-size: 80px 80px; }
  #bg-glow { position: absolute; width: 1400px; height: 1400px; left: 260px; top: -160px; border-radius: 50%;

  #bg-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%); }

  .hud b { color: var(--ink2); font-weight: 700; }
  #hud-tl { left: 72px; top: 56px; }
  #hud-tr { right: 72px; top: 56px; text-align: right; }

  #hud-bl { left: 72px; bottom: 50px; font-size: 15px; letter-spacing: .12em; max-width: 1300px; }
  #hud-br { right: 72px; bottom: 50px; font-size: 15px; }

  .tick { position: absolute; top: -4px; width: 2px; height: 10px; background: #3A3A40; }
  /* 장면 */
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
  .center { position: absolute; left: 0; right: 0; text-align: center; }

  .label { font-family: var(--mono); font-size: 18px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  svg text { font-family: var(--mono); }

    background: linear-gradient(90deg, transparent 0, var(--coral) 18%, var(--coral) 82%, transparent 100%); }

    background: rgba(10,10,11,.72); cursor: pointer; font-family: var(--mono); letter-spacing: .2em; color: var(--ink2); font-size: 22px; }

  #play .btn::after { content: ""; margin-left: 10px; border-left: 44px solid var(--coral); border-top: 28px solid transparent; border-bottom: 28px solid transparent; }
  body.render #play { display: none; }

</head>
<body>

<script>

  typeIn(k1, 9.2, { y: 0, st: 0.02 });
  var t1a = pos(el('div', 'center h-xl', 'AI 발전 속도 추이와', s1), 0, 320);
  var t1b = pos(el('div', 'center h-xl', '<span class="coral">재귀적 자기개선</span>의 영향', s1), 0, 440);
